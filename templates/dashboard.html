<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - VulnShop</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="banner">⚠️ Intentionally vulnerable application - for security training only</div>
  <main class="container">
    <h1>Welcome, {{ user }}</h1>
    <ul class="cards">
      <li><a href="{{ url_for('user_profile', user_id=user_id) }}">View my profile (JSON)</a></li>
      <li><a href="{{ url_for('search') }}">Search products</a></li>
      <li><a href="{{ url_for('logout') }}">Log out</a></li>
    </ul>
    <p class="hint">Training tip: what happens if you change the number in the profile URL?</p>
  </main>
</body>
</html>
