<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VulnShop - Security Training App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="banner">⚠️ Intentionally vulnerable application - for security training only</div>
  <main class="container">
    <h1>VulnShop</h1>
    <p>A deliberately insecure Flask app used to practise finding and fixing vulnerabilities.</p>
    {% if user %}
      <p>Signed in as <strong>{{ user }}</strong> - <a href="{{ url_for('dashboard') }}">Dashboard</a> | <a href="{{ url_for('logout') }}">Log out</a></p>
    {% else %}
      <p><a class="btn" href="{{ url_for('login') }}">Log in</a></p>
    {% endif %}
    <form action="{{ url_for('search') }}" method="get" class="search">
      <input type="text" name="q" placeholder="Search products...">
      <button type="submit">Search</button>
    </form>
  </main>
</body>
</html>
